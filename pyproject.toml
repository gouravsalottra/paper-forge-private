[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-forge"
version = "0.1.0"
description = "Auditable autonomous research system — ARIA control plane over SQLite"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
